// For those who want the bleeding edge
buildscript {
    repositories {
    	mavenLocal()
        mavenCentral()
        jcenter()
        maven { url 'https://repo.spongepowered.org/maven' }
        maven { url 'https://plugins.gradle.org/m2' }
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.6-SNAPSHOT'
        classpath group: 'com.github.jengelman.gradle.plugins', name: 'shadow', version: '4.0.4'
    }
}

apply plugin: 'java'
apply plugin: 'idea'

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'

apply plugin: 'com.github.johnrengelman.shadow'

version = "b1"
group = "dev.somepineaple.phantom" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "phantom"

sourceCompatibility = 1.8
targetCompatibility = 1.8

mixin {
    defaultObfuscationEnv searge
    add sourceSets.main, "phantom.refmap.json"
}

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    
    // the mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   snapshot are built nightly.
    // stable_#            stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not allways work.
    // simply re-run your setup task after changing the mappings to update your workspace.
    mappings = "stable_20"
    makeObfSourceJar = true // an Srg named sources jar is made by default. uncomment this to disable.
}

repositories {
	maven { url 'https://repo.spongepowered.org/maven/' }
}

dependencies {
	compile('org.spongepowered:mixin:0.7.10-SNAPSHOT') {
        exclude module: 'launchwrapper'
    }
    
    compile fileTree(include: ['*.jar'], dir: 'libs')
}

sourceSets {
    main.java.srcDirs += 'src/main/java'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }

    rename '(.+_at.cfg)', 'META-INF/$1'
}

shadowJar {
    dependencies {
        include(dependency('org.spongepowered:mixin'))
    }
    
    classifier = ''
}

reobf { shadowJar { mappingType = 'SEARGE' } }
tasks.reobfShadowJar.mustRunAfter shadowJar

jar {
    manifest {
        attributes([
        	"FMLCorePluginContainsFMLMod": "true",
        	"ForceLoadAsMod": "true",
        	"FMLCorePlugin": "dev.somepineaple.phantom.mixins.MixinLoader",
            "MixinConfigs": "phantom.mixins.json",
            "tweakClass": "org.spongepowered.asm.launch.MixinTweaker",
            'TweakOrder': 0
        ])
    }
}

configurations {
    external
    compile.extendsFrom external
}

build.dependsOn shadowJar
